spring:
  application:
    name: rsfinancial

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rsfinancial}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:mxaka}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway owns the schema (see db/migration) - Hibernate only validates
    # that entities match it, never auto-generates or alters tables. This
    # matters more than usual here: several tables (e.g. medical
    # underwriting) carry deliberate access-control grants applied in SQL
    # migrations - `ddl-auto: update` could silently recreate a table
    # without those grants.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  servlet:
    multipart:
      # Claim photos are the biggest files this API accepts - 10MB covers
      # a phone photo comfortably; raise this (and any reverse proxy's
      # own limit, e.g. nginx client_max_body_size) if that's too tight.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    # Local Vite dev server by default - override with a real env var
    # list in staging/prod.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  file-storage:
    # Relative to the working directory the app is run from. Fine for
    # local dev; in any real deployment this should point at a mounted
    # volume (or better, be replaced with cloud storage - see
    # FileStorageService's class comment) so uploads survive a redeploy.
    upload-dir: ${FILE_STORAGE_UPLOAD_DIR:uploads}

  jwt:
    # No default here on purpose - the app should fail fast on startup if
    # this isn't set, rather than silently signing tokens with a
    # committed/shared secret. Generate a real one with, e.g.:
    #   openssl rand -base64 32
    secret: ${JWT_SECRET:2Ksi4sGVZ+SjOURI+RN7Z5/Ggh5IGFM9eMNEqACGdp8=}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    com.afrofuturists.rsfinancial: DEBUG
